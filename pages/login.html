<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Kailash POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/base.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      block-size: 100vh;
      background: #f6f8fb;
    }

    .login-box {
      inline-size: 350px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }

    .login-box h2 {
      margin-block-end: 15px;
      color: #1f4fd8;
    }

    .login-box input {
      inline-size: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .login-box button {
      inline-size: 100%;
      margin-block-start: 10px;
      padding: 10px;
      background: #1f4fd8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>KAILASH VASTRALAY</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/core/supabase.js"></script>
<script src="../js/core/auth.js"></script>

</body>
</html>
