<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barcode Print – Oddy ST-65</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
@page {
  size: A4;
  margin: 0;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

/* ===== A4 SHEET ===== */
.label-sheet {
  width: 210mm;
  height: 297mm;

  /* EXACT Oddy margins */
  padding-top: 10mm;
  padding-bottom: 10mm;
  padding-left: 9.75mm;
  padding-right: 9.75mm;

  box-sizing: border-box;

  display: grid;
  grid-template-columns: repeat(5, 38.1mm);
  grid-template-rows: repeat(13, 21.2mm);
}

/* ===== SINGLE LABEL ===== */
.label {
  width: 38.1mm;
  height: 21.2mm;

  box-sizing: border-box;
  overflow: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding-top: 1mm;
}

/* ===== TEXT ===== */
.shop {
  font-size: 7.2px;
  font-weight: 600;
  line-height: 1;
}

.product {
  font-size: 7px;
  line-height: 1;
  white-space: nowrap;
  max-width: 36mm;
  overflow: hidden;
  text-overflow: ellipsis;
}

.price {
  font-size: 8px;
  font-weight: bold;
  line-height: 1;
  margin-bottom: 0.5mm;
}

.code-text {
  font-size: 7px;
  line-height: 1;
  margin-top: 0.5mm;
}

/* ===== BARCODE ===== */
svg {
  width: 34mm !important;
  height: 8.5mm !important;
  display: block;
}
</style>
</head>

<body>

<div class="label-sheet" id="labelSheet"></div>

<script>
const settings = JSON.parse(localStorage.getItem("barcodeSettings"));

const code = settings.code;
const product = settings.product || "";
const price = settings.price || "";
const startPos = settings.startPos || 1;
const count = settings.count || 65;

const totalLabels = 65;
const sheet = document.getElementById("labelSheet");

let printed = 0;

for (let i = 1; i <= totalLabels; i++) {
  const div = document.createElement("div");
  div.className = "label";

  if (i >= startPos && printed < count) {
    div.innerHTML = `
      <div class="shop">KAILASH VASTRALAY</div>
      <div class="product">${product}</div>
      <div class="price">₹${price}</div>
      <svg id="bc${i}"></svg>
      <div class="code-text">${code}</div>
    `;

    sheet.appendChild(div);

    JsBarcode(`#bc${i}`, code, {
      format: "CODE128",
      width: 0.8,
      height: 8,
      margin: 0,
      displayValue: false
    });

    printed++;
  } else {
    sheet.appendChild(div);
  }
}

window.print();
</script>

</body>
</html>
