<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Barcode Print – Oddy ST-65</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
@page {
  size: A4;
  margin: 0;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

.label-sheet {
  position: relative;
  width: 210mm;
  height: 297mm;
}

/* EXACT LABEL */
.label {
  position: absolute;
  width: 38.1mm;
  height: 21.2mm;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  padding-top: 1.5mm;   /* 🔥 fixes vertical shift */
  box-sizing: border-box;
  overflow: hidden;
}

/* TEXT */
.shop {
  font-size: 7.5px;
  font-weight: 600;
  line-height: 1;
}

.product {
  font-size: 7px;
  font-weight: 600;
  line-height: 1;
}

.price {
  font-size: 8px;
  font-weight: bold;
  line-height: 1;
  margin-bottom: 0.8mm;
}

svg {
  width: 34mm;
  height: 9mm;
}

.code-text {
  font-size: 7px;
  line-height: 1;
}
</style>
</head>

<body>

<div class="label-sheet" id="labelSheet"></div>

<script>
const settings = JSON.parse(localStorage.getItem("barcodeSettings"));

if (!settings) {
  alert("No barcode data found");
  window.close();
}

const {
  code,
  product,
  price,
  startPos = 1,
  count = 65
} = settings;

/* ===== EXACT FROM YOUR PDF ===== */
const TOTAL_LABELS = 65;
const COLS = 5;

const LABEL_W = 38.1;
const LABEL_H = 21.2;

/* 🔒 LOCKED MARGINS (from PDF visual match) */
const LEFT_MARGIN = 2.5;   // mm
const TOP_MARGIN  = 9.5;   // mm

const sheet = document.getElementById("labelSheet");

let printed = 0;

for (let i = 0; i < TOTAL_LABELS; i++) {
  const label = document.createElement("div");
  label.className = "label";

  const row = Math.floor(i / COLS);
  const col = i % COLS;

  label.style.left = `${LEFT_MARGIN + col * LABEL_W}mm`;
  label.style.top  = `${TOP_MARGIN + row * LABEL_H}mm`;

  if (i + 1 >= startPos && printed < count) {
    label.innerHTML = `
      <div class="shop">KAILASH VASTRALAY</div>
      <div class="product">${product}</div>
      <div class="price">₹${price}</div>
      <svg id="bc${i}"></svg>
      <div class="code-text">${code}</div>
    `;

    sheet.appendChild(label);

    JsBarcode(`#bc${i}`, code, {
      format: "CODE128",
      width: 0.9,
      height: 9,
      margin: 0,
      displayValue: false
    });

    printed++;
  } else {
    sheet.appendChild(label);
  }
}
window.print();
</script>

</body>
</html>
