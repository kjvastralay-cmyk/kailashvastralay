<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barcode Print – Oddy ST-65</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
@page {
  size: A4;
  margin: 0;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.label-sheet {
  width: 210mm;
  height: 297mm;
  box-sizing: border-box;

  /* Oddy ST-65 margins */
  padding-top: 10mm;
  padding-bottom: 10mm;
  padding-left: 2mm;
  padding-right: 2mm;

  display: grid;
  grid-template-columns: repeat(5, 38.1mm);
  grid-template-rows: repeat(13, 21.2mm);

  column-gap: 2mm;
  row-gap: 0mm;
}

/* Single label */
.label {
  width: 38.1mm;
  height: 21.2mm;
  box-sizing: border-box;
  text-align: center;
  overflow: hidden;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* Shop name */
.shop {
  font-size: 7.5px;
  font-weight: 600;
  line-height: 1;
}

/* Product name */
.product {
  font-size: 7px;
  font-weight: normal;
  line-height: 1;
  max-width: 36mm;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Price */
.price {
  font-size: 8px;
  font-weight: bold;
  line-height: 1;
}

/* Barcode SVG */
svg {
  width: 34mm;
  height: 9mm;
}

/* Barcode number */
.code-text {
  font-size: 7px;
  line-height: 1;
}
.product {
  font-size: 7px;
  font-weight: 600;
}

.price {
  font-size: 8px;
  font-weight: bold;
  margin-bottom: 1mm;
}

.code-text {
  font-size: 7px;
}

</style>
</head>

<body>

<div class="label-sheet" id="labelSheet"></div>

<script>
/*
Expected localStorage data:
barcodeSettings = {
  code: "101835",
  product: "BUTTI SAREE",
  price: "970",
  startPos: 1,
  count: 65
}
*/

const settings = JSON.parse(localStorage.getItem("barcodeSettings"));

const code = settings.code;
const product = settings.product || "";
const price = settings.price || "";
const startPos = settings.startPos || 1;
const count = settings.count || 1;

const totalLabels = 65;
const sheet = document.getElementById("labelSheet");

let printed = 0;

for (let i = 1; i <= totalLabels; i++) {
  const div = document.createElement("div");
  div.className = "label";

  if (i >= startPos && printed < count) {
    div.innerHTML = `
      <div class="shop">KAILASH VASTRALAY</div>
      <div class="product">${product}</div>
      <div class="price">₹${price}</div>
      <svg id="bc${i}"></svg>
      <div class="code-text">${code}</div>
      
    `;

    sheet.appendChild(div);

    JsBarcode(`#bc${i}`, code, {
  format: "CODE128",
  width: 0.9,     // 🔥 very thin lines
  height: 9,      // fits 21mm label
  margin: 0,
  displayValue: false
});


    printed++;
  } else {
    sheet.appendChild(div);
  }
}

window.print();
</script>

</body>
</html>
